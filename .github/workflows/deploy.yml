name: Deployment

on:
  push:
    branches: [master]

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    env:
      RUNNER_TRACKING_ID: ""
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false

      - name: Pull branch master
        run: |
          git reset --hard
          git pull

      - name: Check env file
        run: |
          if [ ! -f .env ]
          then
            echo ".env file not found on the server"
            cp .env.example .env
            # exit 1
          fi

      - name: Build Frontend
        run: |
          npm --prefix web ci
          npm --prefix web run build

      - name: Deploy
        run: |
          chmod +x ./scripts/deploy.sh
          bash ./scripts/deploy.sh

          git reset --hard
